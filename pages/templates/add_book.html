{% extends 'base.html' %}
{% block content %}
<h1>Add a New Book</h1>
<form method="post"> <!--This tells the browser to send a POST request when the form is submitted-->
    {% csrf_token %} <!--security requirement cross site request forgery, to make sure someone doesnt code input into our db-->
    {{ form.as_p }}
    <button type="submit">Add Book</button>
</form>
{% endblock %}
