<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Numbers</h1>
    <ul>
        {% for number in numbers %}
            {% if number|divisibleby:2 %}
                <li>{{ number }} - Even</li>
            {% else %}
                <li>{{ number }} - Odd</li>
            {% endif %}
        {% endfor %}
    </ul>
</body>
</html>
