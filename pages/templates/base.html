{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%} My site {% endblock %}</title> <!--default value if child doesnt overwrite it is My site-->
    <link rel="stylesheet" href = "{% static 'css/style.css' %}"> <!--is that the nickname for this url? css/style.css?-->
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>    

    <footer>
        <p>&copy; 2026 My site</p>
    </footer>
</body>
</html>
