{% extends 'base.html' %}
{% block title %} All Books {% endblock %}

{% block content %}
<h1>All Books</h1>
<ul>
    {% for book in books %}  <!--Loop over books. If the list is empty, run the empty block instead.”-->
        <li>
            <a href="/books/{{ book.id }}/">{{ book.title }}</a> 
            ({{ book.year_published }})

        </li>
    {% empty %}
        <li>No books found</li>
    {% endfor %}
</ul>
{% endblock %}
